name: DockerHub Push

on:
  workflow_dispatch:

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t seday1113/github-actions-demo:latest .

      - name: Push Image
        run: |
          docker push seday1113/github-actions-demo:latest
